name: Build and Deploy Orka
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the checked release to the Oracle VM
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: orka-production
  cancel-in-progress: false
env:
  PLATFORM: linux/arm64
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check packaged web assets
        run: node deploy/check-web-release.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ghcr.io/divyaprakashmj20/orka-service:${{ github.sha }}
      - name: Build web UI
        uses: docker/build-push-action@v6
        with:
          context: deploy/web
          platforms: ${{ env.PLATFORM }}
          push: true
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: ghcr.io/divyaprakashmj20/orka-product:${{ github.sha }}
  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy release instructions
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          port: ${{ secrets.OCI_PORT }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: deploy/release.compose.yaml,deploy/release-on-vm.sh
          target: /tmp/orka-release-${{ github.sha }}
      - name: Back up and deploy application containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          ORKA_REGISTRY_USERNAME: ${{ github.actor }}
          ORKA_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          port: ${{ secrets.OCI_PORT }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          envs: ORKA_REGISTRY_USERNAME,ORKA_REGISTRY_PASSWORD
          script: bash /tmp/orka-release-${{ github.sha }}/deploy/release-on-vm.sh ${{ github.sha }}

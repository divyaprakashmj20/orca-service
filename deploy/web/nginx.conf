server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /firebase-config.json { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass http://orka-service:8082/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

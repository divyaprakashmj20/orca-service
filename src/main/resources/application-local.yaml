spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/postgres"
    username: "postgres"
    password: "password"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "update"

server:
  address: 127.0.0.1

firebase:
  admin:
    credentials:
      path: ".secrets/firebase-admin-sdk.json"

orka:
  guest:
    session-ttl: "PT1H"
  notifications:
    pending-reminder:
      enabled: true
      interval: "PT15M"
